[project]
name = "my-ml-project"
version = "0.1.0"
description = ""
authors = [
    {name = "Tatiana Yakubova", email = "surgut.zachet@list.ru"}
]
requires-python = ">=3.13"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.16.10,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)"
]

[tool.poetry]
packages = [{ include = "ml_project", from = "src" }]
